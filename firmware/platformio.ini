; PlatformIO build for CI / command-line checks. The sketch is also a
; normal Arduino IDE sketch: open petroeye_truck/petroeye_truck.ino.
;
;   pio run -e core2   → Arduino-ESP32 core 2.x (PlatformIO's espressif32)
;   pio run -e core3   → Arduino-ESP32 core 3.x (pioarduino)
[platformio]
src_dir = petroeye_truck

[common]
framework = arduino
board = esp32dev
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
  mikalhart/TinyGPSPlus@^1.0.3
  madhephaestus/ESP32Servo@^3.0.5
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  knolleary/PubSubClient@^2.8

[env:core2]
extends = common
platform = espressif32@6.9.0

[env:core3]
extends = common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
